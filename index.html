<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>UFO COUNTER α</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="page1" class="page active">
        <div class="app-header">
          <div class="app-icon" aria-hidden="true"></div>
          <h1>UFO COUNTER α</h1>
        </div>
        <label class="field-label" for="shopInput">店舗名</label>
        <input id="shopInput" type="text" maxlength="30" placeholder="店舗名入力" />
        <button id="cameraBtn" class="button primary">カメラ起動</button>
        <button id="startCountBtn" class="button primary">カウント開始</button>
        <button id="viewDataBtn" class="button pink">データ閲覧</button>
      </section>

      <section id="page2" class="page">
        <div class="page2-topbar">
          <button id="finishCountBtn" class="button red">カウント終了</button>
          <button id="addCounterBtn" class="button pink">カウンター追加</button>
        </div>
        <div id="counterList" class="counter-list"></div>
        <div class="page2-bottombar">
          <button id="modeToggleBtn" class="button secondary">テキスト入力モード</button>
        </div>
      </section>

      <section id="pageA" class="page">
        <h2>店舗一覧</h2>
        <div id="shopList" class="shop-list"></div>
        <button id="backToHomeBtn" class="button secondary">戻る</button>
      </section>

      <section id="pageB" class="page">
        <h2 id="shopDetailTitle">データ表示</h2>
        <div id="shopTotal" class="detail-total">合計値：0</div>
        <div id="detailList" class="detail-list"></div>
        <button id="detailBackBtn" class="button pink">OK</button>
        <button id="deleteShopBtn" class="button primary">データ削除</button>
        <button id="confirmDeleteBtn" class="button secondary hidden">削除確認</button>
        <button id="exportCsvBtn" class="button yellow">CSV出力</button>
      </section>
    </main>

    <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
